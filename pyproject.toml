[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "llmprof"
version = "0.0.1"
description = "pprof for your LLM context - see where every token and dollar goes."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Gaurav Luthra", email = "luthra.zenith@gmail.com" }]
keywords = ["llm", "tokens", "profiler", "observability", "openai", "anthropic", "cost", "context-window"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Software Development :: Libraries",
]
dependencies = [
  "fastapi>=0.110",
  "uvicorn[standard]>=0.27",
  "httpx>=0.27",
  "tiktoken>=0.7",
  "typer>=0.12",
  "rich>=13",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5"]

[project.urls]
Homepage = "https://github.com/luthraG/llmprof"
Issues = "https://github.com/luthraG/llmprof/issues"

[project.scripts]
llmprof = "llmprof.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/llmprof"]

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
