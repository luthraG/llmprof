[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "llmprof"
version = "0.1.2"
description = "pprof for your LLM context - see where every token and dollar goes."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Gaurav Luthra", email = "luthra.zenith@gmail.com" }]
keywords = ["llm", "tokens", "profiler", "observability", "openai", "anthropic", "cost", "context-window"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Software Development :: Libraries",
]
dependencies = [
  "fastapi>=0.110",
  "uvicorn[standard]>=0.27",
  "httpx>=0.27",
  "tiktoken>=0.7",
  "typer>=0.12",
  "rich>=13",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.5"]
# headless dashboard QA harness + asset generators (OG card, demo recording).
# Also needs `playwright install chromium`. Pillow assembles the demo WebP/GIF.
ui = ["playwright>=1.44", "pillow>=10"]

[project.urls]
Homepage = "https://github.com/luthraG/llmprof"
Issues = "https://github.com/luthraG/llmprof/issues"

[project.scripts]
llmprof = "llmprof.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/llmprof"]
artifacts = ["src/llmprof/ui/index.html", "src/llmprof/ui/app.css", "src/llmprof/ui/app.js",
             "src/llmprof/data/model_prices.json"]

# Keep the sdist to source plus metadata. Without an explicit list hatchling sweeps in
# untracked tree contents (docs/node_modules alone is ~75 MB). Patterns are anchored with a
# leading slash so a bare name like LICENSE does not also match docs/node_modules/*/LICENSE.
[tool.hatch.build.targets.sdist]
include = [
  "/src/llmprof",
  "/tests",
  "/README.md",
  "/CHANGELOG.md",
  "/LICENSE",
  "/pyproject.toml",
]

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
addopts = "--cov=llmprof --cov-report=term-missing --cov-fail-under=90"
markers = [
  "ui: headless dashboard tests (need playwright + a chromium browser; run with `pytest tests/ui --no-cov`)",
]

[tool.coverage.run]
source = ["llmprof"]

[tool.coverage.report]
exclude_lines = ["pragma: no cover", "if __name__ == .__main__.:", "raise NotImplementedError"]
