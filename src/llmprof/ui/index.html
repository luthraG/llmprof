<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>llmprof</title>
<link rel="icon" href='data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"><rect x="2" y="3" width="20" height="5" rx="2" fill="%237c84ff"/><rect x="2" y="9.5" width="12" height="5" rx="2" fill="%233ddc97"/><rect x="15" y="9.5" width="7" height="5" rx="2" fill="%23f7a13b"/><rect x="2" y="16" width="7" height="5" rx="2" fill="%232bd4c0"/></svg>'>
<link rel="stylesheet" href="/llmprof/app.css">
</head>
<body>
<div class="topbar">
  <div class="brand">
    <svg class="logo" viewBox="0 0 24 24" aria-hidden="true">
      <rect x="2" y="3" width="20" height="5" rx="2" fill="#7c84ff"/>
      <rect x="2" y="9.5" width="12" height="5" rx="2" fill="#3ddc97"/>
      <rect x="15" y="9.5" width="7" height="5" rx="2" fill="#f7a13b"/>
      <rect x="2" y="16" width="7" height="5" rx="2" fill="#2bd4c0"/>
    </svg>
    <span class="wm">llmpro<span class="pf">f</span></span>
  </div>
  <div class="status" title="llmprof is proxying your LLM calls to this upstream">
    <span class="dot"></span><span class="arrow">proxying to</span>
    <span id="upstream">connecting...</span>
  </div>
  <div class="spacer"></div>
  <div class="spark-wrap"><div class="spark" id="spark"></div><span>cost / day</span></div>
  <div class="kpis">
    <div class="kpi"><b class="num" id="kpi-calls">0</b><span>calls</span></div>
    <div class="kpi"><b class="num" id="kpi-tokens">0</b><span>tokens</span></div>
    <div class="kpi"><b class="num" id="kpi-cost">$0</b><span>est. cost</span></div>
  </div>
  <button class="menu-btn" id="menuBtn" aria-label="Toggle calls list">&#9776;</button>
</div>

<div class="app">
  <aside class="sidebar" id="sidebar">
    <div class="side-head">recent calls</div>
    <div class="side-tools" id="sideTools"></div>
    <div id="calls"></div>
  </aside>
  <main class="main" id="main"></main>
</div>
<div class="scrim" id="scrim"></div>

<div class="tip" id="tip"></div>
<script src="/llmprof/app.js"></script>
</body>
</html>
