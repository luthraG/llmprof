name: Deploy docs

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - '.github/workflows/docs.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# allow one concurrent deployment; don't cancel an in-progress one
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build Astro site
        uses: withastro/action@v3
        with:
          path: docs
          node-version: 22

  deploy:
    needs: build
    # Only deploy when explicitly enabled, so push events just verify the build
    # (green) instead of failing on Pages not being set up yet. To publish: enable
    # Pages with Source = GitHub Actions, then set repo variable DOCS_DEPLOY=true
    # (or run this workflow manually).
    if: ${{ github.event_name == 'workflow_dispatch' || vars.DOCS_DEPLOY == 'true' }}
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
